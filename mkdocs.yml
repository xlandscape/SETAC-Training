site_name: xLandscape Training - SETAC EUROPE 2026
site_url: ""
use_directory_urls: false
plugins:
  - search

repo_url: https://github.com/xlandscape/xLandscapeTraining
repo_name: xLandscapeTraining

theme:
  name: material
  palette:
    - scheme: default
      primary: blue grey
      accent: light blue
      toggle:
        icon: material/brightness-7 
        name: Switch to dark mode
    # Palette toggle for dark mode
    - scheme: slate
      primary: blue grey
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    logo: material/land-plots-marker
  favicon: img/land-plots-marker.svg
  features:
    - content.code.copy
    - navigation.tabs
    - navigation.tabs.sticky
    - toc.integrate

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.details
  - pymdownx.superfences
  - attr_list
  - md_in_html

nav:
  - Home: 'index.md'
  - Introduction: 'introduction.md'
    - Landscape Modelling: 'intro-landscapeModelling.md'
    - Real-world Challenges: 'intro-challenges.md'
    - xLandscape: 'intro-xLandscape.md'
    - Application of xLandscape: 'intro-application.md'
    - Components: 'xLandscape/xLandscape-components.md'
    - Landscape Models: 'xLandscape/xLandscape-models.md'
    - Outlook: 'xLandscape/xLandscape-outlook.md'
  - xAquaticRisk:
    - Intro Higher-tier Aquatic RA: 'xLandscape-templates/templates-intro.md'
    - Simple Excel Interface: 'xLandscape-templates/simple-excel-interface.md'
    - Simple Scenario: 'xLandscape-templates/simple-scenario.md'
    - References: 'xLandscape/xLandscape-references.md'
  - xAquaticRisk-Plants:
    - Introduction: 'xToxicLoad/xToxicLoad-intro.md'
    - Parameterization: 'xToxicLoad/xToxicLoad-parameterization.md'
    - Output: 'xToxicLoad/xToxicLoad-output.md'
    - References: 'xToxicLoad/xToxicLoad-references.md'
  - xPollinatorRisk:
    - Introduction: 'xPollinatorRisk/xPollinatorRisk-intro.md'
    - Parameterization: 'xPollinatorRisk/xPollinatorRisk-parameterization.md'
    - Output: 'xPollinatorRisk/xPollinatorRisk-output.md'
    - References: 'xPollinatorRisk/xPollinatorRisk-references.md'
    